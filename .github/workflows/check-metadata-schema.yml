name: Check metadata-schema version

on:
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 08:00 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      # The PR is opened with the default GITHUB_TOKEN, so it does not start the
      # other CI workflows. That is fine: CI cannot pass before a maintainer
      # pushes `pixi lock` and `migrate-metadata`, and that push starts CI.
      # Requires "Allow GitHub Actions to create and approve pull requests" in
      # Settings > Actions > General.
      - uses: actions/checkout@v7

      - name: Get latest metadata-schema release
        id: latest
        run: |
          VERSION=$(curl -sSf https://api.github.com/repos/echemdb/metadata-schema/releases/latest \
            | jq -r '.tag_name')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get current SCHEMA_VERSION from validate.py
        id: current
        run: |
          VERSION=$(grep -oP 'SCHEMA_VERSION\s*=\s*"\K[^"]+' echemdb_ecdata/validate.py)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Open PR if versions differ
        if: steps.latest.outputs.version != steps.current.outputs.version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ steps.latest.outputs.version }}
          CURRENT: ${{ steps.current.outputs.version }}
        run: |
          BRANCH="update-metadata-schema-${LATEST}"

          # Skip if an update PR for this version is already open, or the
          # branch already exists on the remote. This keeps the scheduled
          # run idempotent instead of failing every week until it is merged.
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "An open PR for $BRANCH already exists; nothing to do."
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists on the remote; nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"

          sed -i "s|SCHEMA_VERSION = \"${CURRENT}\"|SCHEMA_VERSION = \"${LATEST}\"|" \
            echemdb_ecdata/validate.py

          # Keep the mdstools git dependency pinned to the same release.
          sed -i "s|\(mdstools = { git = .*tag = \"\)${CURRENT}\(\" }\)|\1${LATEST}\2|" \
            pyproject.toml

          git add echemdb_ecdata/validate.py pyproject.toml
          git commit -m "Update metadata-schema from ${CURRENT} to ${LATEST}"
          git push origin "$BRANCH"

          gh pr create \
            --title "Update metadata-schema to ${LATEST}" \
            --body "A new release of [echemdb/metadata-schema](https://github.com/echemdb/metadata-schema/releases/tag/${LATEST}) is available.

          This PR updates \`SCHEMA_VERSION\` in \`echemdb_ecdata/validate.py\` and the \`mdstools\` dependency pin in \`pyproject.toml\` from \`${CURRENT}\` to \`${LATEST}\`.

          Before merging:
          - Run \`pixi lock\` locally and push the updated \`pixi.lock\` (the mdstools pin changed).
          - Run \`pixi run -e dev migrate-metadata\` and commit the migrated files (it also sets \`echemdbSchemaVersion\` in all input YAML files, which \`validate-input\` requires).
          - Review the [release notes](https://github.com/echemdb/metadata-schema/releases/tag/${LATEST}) and verify that the schema changes are compatible.
          - Follow the remaining steps in \"Updating the metadata-schema version\" in CONTRIBUTING.md.

          After merging:
          - Merge \`main\` into the open pull requests that add or change input YAML and run \`pixi run -e dev migrate-metadata\` there (or ask the contributor to). Their checks are not re-run automatically." \
            --head "$BRANCH" \
            --base main
