name: News
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: news-${{ github.ref }}
  cancel-in-progress: true

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history needed for git diff against the base branch
      - uses: prefix-dev/setup-pixi@v0.10.1
        with: { pixi-version: v0.72.2 }
      - name: news entries are well-formed
        run: pixi run check-news
      # Changes without a news entry (e.g. CI, typos) use a branch name starting with "silent-fix".
      - name: pull request adds a news entry
        if: github.actor != 'dependabot[bot]' && !startsWith(github.head_ref, 'silent-fix')
        run: |
          if ! git diff --name-only --diff-filter=AM origin/${{ github.base_ref }}...HEAD -- doc/news | grep -v TEMPLATE.rst; then
            echo "No news entry found. Add doc/news/<branch-name>.rst, see 'News entry' in CONTRIBUTING.md."
            exit 1
          fi
